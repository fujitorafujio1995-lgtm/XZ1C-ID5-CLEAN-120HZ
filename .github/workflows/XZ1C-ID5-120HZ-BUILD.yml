              for value in vals:
                  # dtc may emit NUL-separated compatible strings as a literal \\0 escape.
                  value = value.replace("\\0", "\x00")
                  flat.extend(value.split("\x00"))
              return flat

          lilac = compatible_values("out/lilac.dts")
          rumi = compatible_values("out/rumi.dts")
          print("Lilac compatible:", lilac)
          print("RUMI compatible:", rumi)

          if lilac[:2] != ["somc,lilac-dcm", "qcom,msm8998"]:
              raise SystemExit(f"FAIL: unexpected Lilac compatible: {lilac}")
          if rumi[:3] != ["qcom,msmhamster-rumi", "qcom,msmhamster", "qcom,rumi"]:
              raise SystemExit(f"FAIL: unexpected RUMI compatible: {rumi}")

          model = re.search(r'(?m)^\s*model\s*=\s*"([^"]*)";', Path("out/lilac.dts").read_text())
          if not model or model.group(1) != "SoMC Lilac-DCM(MSM8998 v2.1)":
              raise SystemExit("FAIL: unexpected Lilac model")
          print("PASS: DTB compatible/model audit")
          PY

          python3 - <<'PY'
