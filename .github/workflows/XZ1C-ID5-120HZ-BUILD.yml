name: XZ1C ID5 120Hz 120FPS BUILD

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  DEFCONFIG: lineage-msm8998-yoshino-lilac_dcm_defconfig
  BASELINE_REPO: fujitorafujio1995-lgtm/android_kernel_sony_msm8998
  BASELINE_RELEASE: xz1c-android15-baseline
  BASELINE_SHA256: 2b44624558ea4cfc3b9c13bf00b76604da688124d336214e47e001711e37a7be
  KSU_COMMIT: bac3e281b7062ee79448866d48d78eda60c0ba99

jobs:
  build:
    name: SO-02K ID5 Android 15 120Hz/120FPS
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y wget gnupg ca-certificates bc bison flex libssl-dev libelf-dev cpio gzip zip unzip device-tree-compiler gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi python3 file

      - name: Restore exact KernelSU-Next source
        run: |
          set -eux
          git clone --depth=1 --branch legacy https://github.com/justinlin099/KernelSU-Next.git KernelSU-Next
          cd KernelSU-Next
          git fetch --depth=1 origin "${KSU_COMMIT}"
          git checkout "${KSU_COMMIT}"
          cd ..
          test -L drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = "../KernelSU-Next/kernel"

      - name: Download stock Android 15 baseline boot
        env:
          BASELINE_REPO_TOKEN: ${{ secrets.BASELINE_REPO_TOKEN }}
        run: |
          set -eux
          mkdir -p rom
          test -n "${BASELINE_REPO_TOKEN:-}"
          GH_TOKEN="$BASELINE_REPO_TOKEN" gh release download "${BASELINE_RELEASE}" --repo "${BASELINE_REPO}" --pattern "Android_15_SO-02K_Update.zip" --dir rom
          test -s rom/Android_15_SO-02K_Update.zip
          test "$(sha256sum rom/Android_15_SO-02K_Update.zip | cut -d' ' -f1)" = "${BASELINE_SHA256}"
          unzip -p rom/Android_15_SO-02K_Update.zip boot.img > rom/boot.img
          test -s rom/boot.img

      - name: Apply ONLY ID5 DTB 120Hz parameters
        run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("arch/arm/boot/dts/qcom/dsi-panel-lilac.dtsi")
          s=p.read_text()
          m=re.search(r'(?ms)^\s*dsi_5:\s*somc,5_panel\s*\{.*?^\s*\};',s)
          if not m: raise SystemExit("FAIL: ID5 panel block not found")
          b=m.group(0)
          for old,new in [
            ("qcom,mdss-dsi-panel-framerate = <60>;","qcom,mdss-dsi-panel-framerate = <120>;"),
            ("qcom,mdss-dsi-panel-clockrate = <899000000>;","qcom,mdss-dsi-panel-clockrate = <1798076160>;")
          ]:
            if b.count(old)!=1: raise SystemExit("FAIL: expected exactly one ID5 property: "+old)
            b=b.replace(old,new,1)
          p.write_text(s[:m.start()]+b+s[m.end():])
          PY
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "arch/arm/boot/dts/qcom/dsi-panel-lilac.dtsi"
          grep -A120 -E '^\s*dsi_5:\s*somc,5_panel' arch/arm/boot/dts/qcom/dsi-panel-lilac.dtsi | grep -E 'panel-framerate|panel-clockrate'

      - name: Configure Lilac DCM
        run: |
          set -eux
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- "${DEFCONFIG}"
          sed -i 's|^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES=.*|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES="qcom/msm8998-v2.1-yoshino-lilac_dcm qcom/msmhamster-rumi"|' out/.config
          make O=out ARCH=arm64 olddefconfig
          grep -q '^CONFIG_MACH_SONY_LILAC_DCM=y$' out/.config
          grep -q '^CONFIG_ARCH_MSMHAMSTER=y$' out/.config
          grep -q '^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y$' out/.config
          grep -q '^CONFIG_IMG_GZ_DTB=y$' out/.config
          grep -q '^CONFIG_KSU=y$' out/.config

      - name: Build Image.gz-dtb
        run: |
          set -eux
          make -j"$(nproc)" O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CONFIG_CC_WERROR=n KCFLAGS="-Wno-error -Wno-unused-value -Wno-maybe-uninitialized" Image.gz-dtb
          test -s out/arch/arm64/boot/Image.gz-dtb
          file out/arch/arm64/boot/Image.gz-dtb
          sha256sum out/arch/arm64/boot/Image.gz-dtb

      - name: Audit appended DTB order
        run: |
          set -eux
          python3 - <<'PY'
          import struct,zlib
          from pathlib import Path
          MAGIC=b"\xd0\x0d\xfe\xed"
          def dtbs(k):
            d=zlib.decompressobj(16+zlib.MAX_WBITS)
            d.decompress(k)
            x=d.unused_data
            out=[]; p=0
            while p+8<=len(x) and x[p:p+4]==MAGIC:
              n=struct.unpack(">I",x[p+4:p+8])[0]
              if n<40 or p+n>len(x): raise SystemExit("FAIL: malformed appended DTB")
              out.append(x[p:p+n]); p+=n
            return out
          k=Path("out/arch/arm64/boot/Image.gz-dtb").read_bytes()
          ds=dtbs(k)
          if len(ds)!=2: raise SystemExit(f"FAIL: expected exactly 2 appended DTBs, found {len(ds)}")
          lilac=Path("out/arch/arm64/boot/dts/qcom/msm8998-v2.1-yoshino-lilac_dcm.dtb").read_bytes()
          rumi=Path("out/arch/arm64/boot/dts/qcom/msmhamster-rumi.dtb").read_bytes()
          if ds[0]!=lilac: raise SystemExit("FAIL: first appended DTB is not Lilac-DCM")
          if ds[1]!=rumi: raise SystemExit("FAIL: second appended DTB is not RUMI")
          if ds[0]==rumi: raise SystemExit("FAIL: DTB identity/order invalid")
          print("PASS: appended DTB order is Lilac-DCM -> RUMI")
          print(f"Lilac DTB bytes: {len(ds[0])}")
          print(f"RUMI DTB bytes: {len(ds[1])}")
          PY

      - name: Prepare mkbootimg tools
        run: |
          set -eux
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg boot-tools
          python3 boot-tools/mkbootimg.py --help | grep -q -- '--os_version'
          python3 boot-tools/mkbootimg.py --help | grep -q -- '--os_patch_level'

      - name: Unpack stock boot
        run: |
          set -eux
          mkdir -p boot-original
          python3 boot-tools/unpack_bootimg.py --boot_img rom/boot.img --out boot-original > boot-original/unpack.log 2>&1
          test -s boot-original/kernel
          test -s boot-original/ramdisk

      - name: Repack 120Hz boot.img with exact stock metadata
        run: |
          set -eux
          L=boot-original/unpack.log
          OS_VERSION="$(sed -n 's/^os version: //p' "$L")"
          OS_PATCH_LEVEL="$(sed -n 's/^os patch level: //p' "$L")"
          CMDLINE="$(sed -n 's/^command line args: //p' "$L")"
          test "$OS_VERSION" = "15.0.0"
          test "$OS_PATCH_LEVEL" = "2026-05"
          test -n "$CMDLINE"
          python3 boot-tools/mkbootimg.py --kernel out/arch/arm64/boot/Image.gz-dtb --ramdisk boot-original/ramdisk --base 0x00000000 --kernel_offset 0x00008000 --ramdisk_offset 0x01000000 --tags_offset 0x00000100 --pagesize 4096 --header_version 0 --os_version "$OS_VERSION" --os_patch_level "$OS_PATCH_LEVEL" --cmdline "$CMDLINE" --output boot-120hz-120fps.img
          test -s boot-120hz-120fps.img

      - name: Strict stock-structure verification
        run: |
          set -eux
          rm -rf boot-verified
          mkdir -p boot-verified
          python3 boot-tools/unpack_bootimg.py --boot_img boot-120hz-120fps.img --out boot-verified > boot-verified/unpack.log 2>&1
          test "$(sha256sum boot-original/ramdisk | awk '{print $1}')" = "$(sha256sum boot-verified/ramdisk | awk '{print $1}')"
          test "$(sed -n 's/^command line args: //p' boot-original/unpack.log)" = "$(sed -n 's/^command line args: //p' boot-verified/unpack.log)"
          python3 - <<'PY'
          import struct
          from pathlib import Path
          a=Path("rom/boot.img").read_bytes(); b=Path("boot-120hz-120fps.img").read_bytes()
          if a[:8]!=b[:8] or a[:8]!=b"ANDROID!": raise SystemExit("FAIL: magic")
          ah=struct.unpack_from("<10I",a,8); bh=struct.unpack_from("<10I",b,8)
          for i,n in enumerate(["kernel_size","kernel_addr","ramdisk_size","ramdisk_addr","second_size","second_addr","tags_addr","page_size","header_version","os_version_raw"]):
            if i==0: continue
            if ah[i]!=bh[i]: raise SystemExit(f"FAIL: {n}: {ah[i]} != {bh[i]}")
          if ah[7]!=4096: raise SystemExit("FAIL: page size")
          print("PASS: stock boot header fields preserved; only kernel_size may differ")
          PY
          python3 - <<'PY'
          import struct,zlib
          from pathlib import Path
          MAGIC=b"\xd0\x0d\xfe\xed"
          def dtbs(k):
            d=zlib.decompressobj(16+zlib.MAX_WBITS); d.decompress(k); x=d.unused_data
            out=[]; p=0
            while p+8<=len(x) and x[p:p+4]==MAGIC:
              n=struct.unpack(">I",x[p+4:p+8])[0]
              if n<40 or p+n>len(x): raise SystemExit("FAIL: bad DTB")
              out.append(x[p:p+n]); p+=n
            return out
          s=dtbs(Path("boot-original/kernel").read_bytes()); n=dtbs(Path("boot-verified/kernel").read_bytes())
          if len(s)!=2 or len(n)!=2: raise SystemExit(f"FAIL: DTB count stock={len(s)} new={len(n)}")
          if s[1]!=n[1]: raise SystemExit("FAIL: RUMI DTB changed")
          if s[0]==n[0]: raise SystemExit("FAIL: Lilac DTB did not change")
          print("PASS: DTB order Lilac-DCM -> RUMI preserved")
          print("PASS: RUMI DTB byte-identical to stock")
          print("PASS: only Lilac DTB changed")
          PY

      - name: Package final artifacts
        run: |
          set -eux
          mkdir -p artifact
          cp boot-120hz-120fps.img artifact/
          cp rom/boot.img artifact/boot-original.img
          cp out/arch/arm64/boot/Image.gz-dtb artifact/
          cp arch/arm/boot/dts/qcom/dsi-panel-lilac.dtsi artifact/dsi-panel-lilac-ID5-120hz.dtsi
          sha256sum artifact/* > artifact/SHA256SUMS

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XZ1C-SO02K-ID5-120Hz-120FPS-BOOT
          path: artifact/
          if-no-files-found: error
