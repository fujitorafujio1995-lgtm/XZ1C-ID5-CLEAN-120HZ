              if size < 40 or p + size > len(appended):
                  raise SystemExit(f"FAIL: invalid FDT size {size} at appended offset {p}")
              hits.append((p, size))
              p += size

          print("gzip stream bytes:", len(image) - len(appended))
          print("appended DTB bytes:", len(appended))
          print("appended DTBs:", hits)

          if len(hits) != 2:
              raise SystemExit(f"FAIL: expected exactly 2 appended DTBs, found {len(hits)}")

          lilac = Path("out/arch/arm64/boot/dts/qcom/msm8998-v2.1-yoshino-lilac_dcm.dtb").read_bytes()
          rumi = Path("out/arch/arm64/boot/dts/qcom/msmhamster-rumi.dtb").read_bytes()

          first_off, first_size = hits[0]
          second_off, second_size = hits[1]

          if appended[first_off:first_off+first_size] != lilac:
              raise SystemExit("FAIL: first appended DTB is not byte-identical to Lilac-DCM DTB")
          if appended[second_off:second_off+second_size] != rumi:
              raise SystemExit("FAIL: second appended DTB is not byte-identical to RUMI DTB")
          if first_off + first_size != second_off:
              raise SystemExit("FAIL: appended DTBs are not contiguous")
